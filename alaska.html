<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>🛩️ Alaska · Jul 2–14, 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f1;color:#1a1a1a;padding:16px;max-width:760px;margin:0 auto}
a{color:#185FA5;text-decoration:none}a:hover{text-decoration:underline}
.back-link{font-size:13px;color:#185FA5;display:inline-block;margin-bottom:12px}
.page-header{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:20px;border:.5px solid #e5e5e5}
.page-header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.page-header .sub{font-size:13px;color:#888}
.day-block{background:#fff;border-radius:16px;margin-bottom:16px;border:.5px solid #e5e5e5;overflow:hidden}
.day-header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:.5px solid #f0f0f0;background:#fafaf9}
.day-date{min-width:48px;text-align:center}
.day-date .dow{font-size:11px;color:#999;text-transform:uppercase;font-weight:600}
.day-date .num{font-size:28px;font-weight:700;line-height:1;color:#185FA5}
.day-date .mon{font-size:11px;color:#999;font-weight:500}
.day-title{font-size:15px;font-weight:600}
.day-location{font-size:12px;color:#888;margin-top:2px}
.cards{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.card{border-radius:12px;padding:12px 14px;border:.5px solid #e8e8e8}
.card.flight  {background:#EEF5FD;border-color:#C8DEFA}
.card.parking {background:#FEF9EE;border-color:#F0DFA8}
.card.hotel   {background:#F0FBF0;border-color:#B6E2B6}
.card.rental  {background:#FDF4FF;border-color:#E2C8F5}
.card.activity{background:#FFF4F0;border-color:#F5C8B6}
.card.day-note{background:#f9f9f7;border-color:#e5e5e5}
.card.free    {background:#F5FFF5;border-color:#B6E2C8}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase}
.badge.flight  {background:#C8DEFA;color:#185FA5}
.badge.parking {background:#F0DFA8;color:#7A5C00}
.badge.hotel   {background:#B6E2B6;color:#1B5E1B}
.badge.rental  {background:#E2C8F5;color:#6A0080}
.badge.activity{background:#F5C8B6;color:#8B2500}
.badge.day-note{background:#e5e5e5;color:#555}
.badge.free    {background:#B6E2C8;color:#1B5E30}
.card-title{font-size:13px;font-weight:600;flex:1}
.card-status{font-size:11px;margin-left:auto;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.card-status.booked{background:#D1FAE5;color:#065F46}
.card-status.soon  {background:#FEF3C7;color:#92400E}
.card-body{font-size:12.5px;color:#444;line-height:1.7}
.card-body .row{margin-bottom:1px}
.card-body .note{color:#888;font-size:12px;margin-top:4px;font-style:italic}
.card-body a{font-size:12px}
.act-grid{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.act-item{background:#fff;border-radius:8px;padding:8px 10px;border:.5px solid #e5e5e5}
.act-item .at{font-size:12.5px;font-weight:600;margin-bottom:2px}
.act-item .ad{font-size:12px;color:#666;line-height:1.5}
.warn{background:#FEF3C7;border:.5px solid #F59E0B;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400E;margin-top:6px}
.loading{text-align:center;padding:40px;color:#aaa;font-size:14px}
@media(max-width:480px){body{padding:10px}.day-header{padding:12px 14px}.cards{padding:10px 12px}}
</style>
</head>
<body>
<a class="back-link" href="index.html">← Travel Itinerary</a>
<div class="page-header">
  <h1>🛩️ Alaska · Jul 2–14, 2026</h1>
  <div class="sub">Rajkumar &amp; Kokeela Rathi &nbsp;·&nbsp; Charlotte → Chicago → Alaska → Charlotte</div>
</div>
<div id="root"><div class="loading">Loading itinerary…</div></div>
<script>
const BADGE_LABEL={flight:'Flight',parking:'Parking',hotel:'Stay',rental:'Rental Car',activity:'Activity','day-note':'Day',free:'Free'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderCard(c){
  const bl=c.badge||BADGE_LABEL[c.type]||c.type;
  const st=c.status?`<span class="card-status ${c.status}">${c.status==='booked'?'✓ Booked':'🟡 Book soon'}</span>`:'';
  const rows=(c.rows||[]).map(r=>`<div class="row">${esc(r)}</div>`).join('');
  const note=c.note?`<div class="note">${esc(c.note)}</div>`:'';
  const link=c.link?`<div class="row" style="margin-top:4px"><a href="${c.link}" target="_blank">${esc(c.linkText||'Open ↗')}</a></div>`:'';
  const warn=c.warning?`<div class="warn">${esc(c.warning)}</div>`:'';
  const acts=(c.activities||[]).length?`<div class="act-grid">${c.activities.map(a=>`<div class="act-item"><div class="at">${esc(a.title)}</div><div class="ad">${esc(a.desc)}</div></div>`).join('')}</div>`:'';
  return `<div class="card ${c.type}"><div class="card-header"><span class="badge ${c.type}">${esc(bl)}</span><span class="card-title">${esc(c.title)}</span>${st}</div><div class="card-body">${rows}${note}${acts}${link}${warn}</div></div>`;
}
function renderDay(d){
  return `<div class="day-block"><div class="day-header"><div class="day-date"><div class="dow">${esc(d.dow)}</div><div class="num">${esc(d.num)}</div><div class="mon">${esc(d.mon)}</div></div><div><div class="day-title">${esc(d.title)}</div><div class="day-location">📍 ${esc(d.location)}</div></div></div><div class="cards">${(d.cards||[]).map(renderCard).join('')}</div></div>`;
}
fetch('alaska.json?'+Date.now())
  .then(r=>r.json())
  .then(days=>{document.getElementById('root').innerHTML=days.map(renderDay).join('');})
  .catch(e=>{document.getElementById('root').innerHTML=`<div class="loading">Error: ${e.message}</div>`;});
</script>
</body>
</html>
